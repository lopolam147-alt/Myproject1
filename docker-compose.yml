version: '3.8'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: # Set my name
      POSTGRES_PASSWORD: # Set my password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresqldocker-compose down
volumes:
  postgres_data: